services:
  db:
    image: postgres:16-alpine
    container_name: adesso-league-db
    environment:
      POSTGRES_DB: adesso_league
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appuser
    ports:
      # Published on 5433: a locally installed PostgreSQL commonly owns 5432 and would silently
      # shadow this container for host connections.
      - "5433:5432"
    volumes:
      - adesso-league-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d adesso_league"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/AdessoLeague.Api/Dockerfile
    container_name: adesso-league-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development here is what enables Swagger and the migrate-on-startup step; the image itself
      # carries no environment default.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=adesso_league;Username=appuser;Password=appuser"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  adesso-league-db-data:
